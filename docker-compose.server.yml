# For the server (the domain): the Rust app + MariaDB + Caddy for HTTPS. People open https://your-domain (no port number).
# Needs a DNS A record for the domain pointing to this server, and ports 80 and 443 open on it.
# Hardened: only Caddy is reachable from outside; the database sits on a private network with no way out to the internet;
# containers run without extra privileges, the app with a read-only filesystem. phpMyAdmin is not included on the server.
#   1. copy .env.example to .env, set STRONG passwords, and add a line: DOMAIN=orders.example.com
#   2. docker compose -f docker-compose.server.yml up -d --build
# If the server already runs its own Caddy, do not start this one: use only the mariadb and app services and add the
# domain block from the Caddyfile to the existing Caddyfile (reverse_proxy to this app's container, port 8765).
# See HARDENING.md for the server itself (firewall, SSH, updates, backups).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mariadb:
    image: mariadb:11.4
    container_name: florida-3pl-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in the .env file}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the .env file}
      MARIADB_ROOT_HOST: localhost    # the root account can only be used from inside this container
      TZ: America/New_York
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=256M", "--max-allowed-packet=64M", "--local-infile=0", "--skip-name-resolve"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - db-data:/var/lib/mysql   # the database files: back up with mariadb-dump
    networks:
      - private                   # no published ports, and this network has no route to the internet
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    build: .
    container_name: florida-3pl-rust
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mariadb:3306/${DB_NAME}
      HTTPS_ONLY: "1"             # sign-in cookies are always Secure, browsers are told to use HTTPS only
    expose:
      - "8765"                     # only Caddy can reach it
    read_only: true                # the program cannot change its own files
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - ./import-data:/import:ro   # a copy of the old app's data folder, for: florida-3pl import /import
      - ./data:/app/data           # the Google API key (drive_key.txt), the logo and uploaded files: keep and back up
    networks:
      - private
      - front                      # lets it be reached by Caddy and reach Google (Drive names, returns sheet)
    logging: *logging

  caddy:
    image: caddy:2
    container_name: florida-3pl-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the .env file, for example orders.example.com}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - front
    logging: *logging

networks:
  private:
    internal: true                 # containers on it can talk to each other, but not to the internet
  front: {}

volumes:
  db-data:
  caddy_data:
  caddy_config:
