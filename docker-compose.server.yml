# For the server (the domain): the Rust app (image from Docker Hub) + MariaDB + phpMyAdmin + Caddy for HTTPS.
# People open https://DOMAIN (the app) and, from allowed addresses only, https://PMA_DOMAIN (phpMyAdmin): no port numbers.
# Needs DNS A records for both names pointing to this server, and ports 80 and 443 open on it.
# Hardened: only Caddy is reachable from outside; the database sits on a private network with no way out to the internet;
# containers run without extra privileges, the app with a read-only filesystem.
#   1. copy .env.example to .env, set STRONG passwords, and add DOMAIN, PMA_DOMAIN and PMA_ALLOW (see .env.example)
#   2. docker compose -f docker-compose.server.yml up -d
# If the server already runs its own Caddy, do not start this one: start only mariadb, app and phpmyadmin, and add both
# blocks from the Caddyfile to the existing Caddyfile (reverse_proxy to florida-3pl-rust:8765 and florida-3pl-phpmyadmin:80).
# See HARDENING.md for the server itself (firewall, SSH, updates, backups).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mariadb:
    image: mariadb:11.4
    container_name: florida-3pl-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in the .env file}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the .env file}
      MARIADB_ROOT_HOST: localhost    # the root account can only be used from inside this container
      TZ: America/New_York
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=256M", "--max-allowed-packet=64M", "--local-infile=0", "--skip-name-resolve"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - db-data:/var/lib/mysql   # the database files: back up with mariadb-dump
    networks:
      - private                   # no published ports, and this network has no route to the internet
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    image: ascendrachel/florida-3pl-v2:latest   # pulled from Docker Hub (no building on the server). To build from the source instead: replace this line with `build: .`
    pull_policy: always
    container_name: florida-3pl-rust
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mariadb:3306/${DB_NAME}
      HTTPS_ONLY: "1"             # sign-in cookies are always Secure, browsers are told to use HTTPS only
    expose:
      - "8765"                     # only Caddy can reach it
    read_only: true                # the program cannot change its own files
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - ./import-data:/import:ro   # a copy of the old app's data folder, for: florida-3pl import /import
      - ./data:/app/data           # the Google API key (drive_key.txt), the logo and uploaded files: keep and back up
    networks:
      - private
      - front                      # lets it be reached by Caddy and reach Google (Drive names, returns sheet)
    logging: *logging

  # phpMyAdmin: not published; reached only through Caddy at https://PMA_DOMAIN, and Caddy lets in only the addresses in PMA_ALLOW.
  phpmyadmin:
    image: phpmyadmin:5
    container_name: florida-3pl-phpmyadmin
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_ABSOLUTE_URI: https://${PMA_DOMAIN:?set PMA_DOMAIN in the .env file, for example db.example.com}/
      UPLOAD_LIMIT: 256M
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    networks:
      - private                   # to reach MariaDB
      - front                     # to be reached by Caddy
    logging: *logging

  caddy:
    image: caddy:2
    container_name: florida-3pl-caddy
    restart: unless-stopped
    depends_on:
      - app
      - phpmyadmin
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the .env file, for example orders.example.com}
      PMA_DOMAIN: ${PMA_DOMAIN:?set PMA_DOMAIN in the .env file, for example db.example.com}
      PMA_ALLOW: "${PMA_ALLOW:?set PMA_ALLOW in the .env file (the addresses allowed to open phpMyAdmin, for example 203.0.113.5 or 203.0.113.0/24)}"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - front
    logging: *logging

networks:
  private:
    internal: true                 # containers on it can talk to each other, but not to the internet
  front: {}

volumes:
  db-data:
  caddy_data:
  caddy_config:
